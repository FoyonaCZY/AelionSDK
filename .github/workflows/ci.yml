name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:version:check
      - run: pnpm run compatibility:check
      - run: pnpm run report:device-matrix:check
      - run: pnpm run format:check
      - run: pnpm run schemas:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:schema

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:check
      - run: pnpm run docs:typecheck
      - run: pnpm run build:docs
      - run: pnpm run docs:check:built

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:quickstart
      - run: pnpm run api:snapshot
      - run: pnpm run test:pack
      - run: pnpm run release:dry-run
      - run: pnpm run release:reproducibility

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:browser:mobile

  firefox-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:browser:firefox
      - run: pnpm test:browser:webkit
      - run: pnpm test:consumer

  nightly-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:browser
      - run: pnpm test:browser:firefox
      - run: pnpm test:browser:webkit
      - run: pnpm test:browser:mobile
      - run: pnpm test:golden
      - run: pnpm run test:soak
      - run: pnpm bench
      - run: pnpm report:capability:matrix
      - run: pnpm report:device-matrix
      - run: pnpm report:seek
      # Hosted-runner load and virtualized GPU throughput are not a release reference device.
      # Preserve the complete raw report for trend inspection, but keep the strict SLO validator
      # in the source-bound release gate where the reviewed reference machine is controlled.
      - name: Capture shared-runner performance observation
        id: shared-performance
        continue-on-error: true
        env:
          AELION_PERFORMANCE_RAW_PATH: reports/performance-observation.json
        run: pnpm report:performance
      - name: Report shared-runner SLO variance
        if: steps.shared-performance.outcome == 'failure'
        run: echo "::notice::The raw performance observation was captured; shared-runner SLO variance does not replace or fail the strict release-device gate."
      - run: pnpm report:recovery
      - run: pnpm report:phase3:check
      - run: pnpm report:vertical
      - run: pnpm report:alpha
      - uses: actions/upload-artifact@v7
        with:
          name: aelion-nightly-evidence
          path: |
            reports/baseline/*.json
            reports/baseline/*.webm
            reports/performance-observation.json
